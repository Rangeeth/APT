name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count is correct

      - name: Stamp version into index.html
        run: |
          # Format: YYYYMMDD.HH.MM#<revision>   (UTC time; revision = total commit count)
          REV=$(git rev-list --count HEAD)
          VER="$(date -u +%Y%m%d.%H.%M)#${REV}"
          echo "Version: $VER"
          sed -i "s/__VERSION__/${VER}/g" index.html
          grep -c "$VER" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
